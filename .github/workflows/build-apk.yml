name: Build Ionic Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Ionic Vue application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java environment
        run: |
          java --version
          javac --version

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$sdkmanager_path" ]; then
            "$sdkmanager_path" --version
          elif command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version
          else
            echo "sdkmanager is unavailable; listing the installed SDK instead."
            test -d "$ANDROID_HOME/platforms"
            test -d "$ANDROID_HOME/build-tools"
            find "$ANDROID_HOME" -maxdepth 2 -type d -print | sort | head -40
          fi

      - name: Sync Capacitor Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Ionic Calculator APK
        uses: actions/upload-artifact@v4
        with:
          name: IonicCalculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
